# Added by Hermes migration (2026-08-04)
# This repo has BOTH package-lock.json and pnpm-lock.yaml; nixpacks prefers
# pnpm and breaks (no workspace packages). Force npm for install + build.
[phases.install]
commands = ["npm install --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[variables]
NIXPACKS_NODE_VERSION = "20"
